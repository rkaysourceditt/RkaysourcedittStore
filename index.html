<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RKAYSOURCEDITT™</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:#fff;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
background:#0a0a0a;
border-bottom:1px solid #222;
position:sticky;
top:0;
}

.logo{
font-size:32px;
font-weight:bold;
color:red;
}

nav a{
color:white;
text-decoration:none;
margin:0 10px;
}

.hero{
height:80vh;
display:flex;
flex-direction:column;
justify-content:center;
padding:50px;
background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7));
}

.hero h1{
font-size:70px;
color:red;
}

.hero p{
font-size:20px;
margin:20px 0;
}

.btn{
background:red;
color:white;
padding:15px 30px;
text-decoration:none;
display:inline-block;
}

.categories{
padding:50px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.card{
background:#111;
padding:20px;
border:1px solid #222;
text-align:center;
}

footer{
padding:40px;
background:#0a0a0a;
text-align:center;
margin-top:50px;
}
</style>
</head>

<body>

<header>
<div class="logo">RKAYSOURCEDITT™</div>

<nav>
<a href="#">Home</a>
<a href="#">Shop</a>
<a href="#">Reviews</a>
<a href="#">Contact</a>
</nav>
</header>

<section class="hero">
<h1>RKAYSOURCEDITT™</h1>
<p>Streetwear • Sneakers • Luxury</p>
<a href="#" class="btn">SHOP NOW</a>
</section>

<section class="categories">
<h2>Shop Categories</h2>

<div class="grid">

<div class="card">Tracksuits</div>
<div class="card">Sneakers</div>
<div class="card">Jackets</div>
<div class="card">Bags</div>
<div class="card">Hats</div>
<div class="card">Electronics</div>
<div class="card">Jewellery</div>

</div>
</section>

<footer>
<h3>RKAYSOURCEDITT™</h3>
<p>@rkaysourceditt</p>
</footer>

</body>
</html>
